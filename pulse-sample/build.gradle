plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rabbah.pulsesample'
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.rabbah.pulsesample"
        minSdkVersion 30
        targetSdkVersion 30
        versionCode 6
        versionName "1.5"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation project(':hardware-lib')
}
