plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rabbah.mdb'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 30
        targetSdkVersion 30
        // Embedded in the AAR: R8 keep rules auto-applied to ANY consuming app, so a minified
        // build can never strip this reflection-reached library (no app-side proguard edits).
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // NO MQTT dependency: this library is pure hardware/protocol. Everything it produces
    // (exchanges, state, control snapshots) comes out through listeners; how it travels
    // (MQTT, HTTP, BLE, nothing) is entirely the host app's choice.
    implementation(name: 'CM30-HardwareLibrary-1.0.9', ext: 'aar')
}
